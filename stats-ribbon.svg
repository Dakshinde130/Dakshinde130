<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="7 projects, 11 certifications, 83 of 83 tests passing, 2000+ fest guests hosted">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171021"/>
      <stop offset="1" stop-color="#1d1216"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe8cf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe8cf" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffe8cf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="146" rx="22" fill="url(#rb)" stroke="#2a2140" stroke-width="1.5"/>

  <!-- kanji watermarks -->
  <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="86" fill="#ffe8cf" opacity=".05" text-anchor="middle">
    <text x="150" y="112">創</text>
    <text x="450" y="112">学</text>
    <text x="750" y="112">試</text>
    <text x="1050" y="112">祭</text>
  </g>

  <!-- separators -->
  <g stroke="#2a2140" stroke-width="1.5">
    <line x1="300" y1="30" x2="300" y2="120"/>
    <line x1="600" y1="30" x2="600" y2="120"/>
    <line x1="900" y1="30" x2="900" y2="120"/>
  </g>

  <!-- cells -->
  <g text-anchor="middle">
    <g>
      <text x="150" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#ffe8cf">07<animate attributeName="opacity" values="1;.8;1" dur="4s" repeatCount="indefinite"/></text>
      <text x="150" y="106" font-family="Georgia,serif" font-style="italic" font-size="13" letter-spacing="2" fill="#ffb56b">projects built</text>
    </g>
    <g>
      <text x="450" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#ffe8cf">11<animate attributeName="opacity" values="1;.8;1" dur="4s" repeatCount="indefinite" begin=".5s"/></text>
      <text x="450" y="106" font-family="Georgia,serif" font-style="italic" font-size="13" letter-spacing="2" fill="#ffb56b">certifications</text>
    </g>
    <g>
      <text x="750" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#ffe8cf">83/83<animate attributeName="opacity" values="1;.8;1" dur="4s" repeatCount="indefinite" begin="1s"/></text>
      <text x="750" y="106" font-family="Georgia,serif" font-style="italic" font-size="13" letter-spacing="2" fill="#ffb56b">tests passing</text>
    </g>
    <g>
      <text x="1050" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#ffe8cf">2000+<animate attributeName="opacity" values="1;.8;1" dur="4s" repeatCount="indefinite" begin="1.5s"/></text>
      <text x="1050" y="106" font-family="Georgia,serif" font-style="italic" font-size="13" letter-spacing="2" fill="#ffb56b">fest guests hosted</text>
    </g>
  </g>

  <!-- sparkles -->
  <g font-family="Arial,sans-serif" font-size="13" fill="#ffb56b">
    <text x="196" y="52">✦<animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="497" y="48">✦<animate attributeName="opacity" values="1;.15;1" dur="3.3s" repeatCount="indefinite"/></text>
    <text x="822" y="52">✦<animate attributeName="opacity" values=".15;1;.15" dur="2.5s" repeatCount="indefinite" begin=".7s"/></text>
    <text x="1122" y="48">✦<animate attributeName="opacity" values="1;.15;1" dur="3s" repeatCount="indefinite" begin="1.2s"/></text>
  </g>

  <!-- travelling shimmer -->
  <rect x="-300" y="2" width="300" height="146" fill="url(#shimmer)" transform="skewX(-12)">
    <animate attributeName="x" values="-300;1500" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
