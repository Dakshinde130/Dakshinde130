<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Daksh Shinde — night ramen banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0918"/>
      <stop offset=".55" stop-color="#171021"/>
      <stop offset=".85" stop-color="#241318"/>
      <stop offset="1" stop-color="#2b1712"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe8cf" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffd9a0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="nameShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe8cf"/>
      <stop offset=".5" stop-color="#ffb56b"/>
      <stop offset="1" stop-color="#ffe8cf"/>
    </linearGradient>
    <filter id="soft6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect y="150" width="1200" height="150" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#ffe8cf">
    <circle cx="80"  cy="38"  r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="176" cy="90"  r="1"><animate attributeName="opacity" values="1;.15;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="30"  r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite" begin=".6s"/></circle>
    <circle cx="335" cy="70"  r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.8s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="420" cy="26"  r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite" begin=".3s"/></circle>
    <circle cx="505" cy="58"  r="1"><animate attributeName="opacity" values=".25;1;.25" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="24"  r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="660" cy="80"  r="1"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite" begin=".8s"/></circle>
    <circle cx="738" cy="40"  r="1.2"><animate attributeName="opacity" values=".2;.95;.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="96"  r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4.2s" repeatCount="indefinite" begin="1.9s"/></circle>
    <circle cx="905" cy="30"  r="1.3"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite" begin=".4s"/></circle>
    <circle cx="975" cy="140" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.9s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="1145" cy="50" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite" begin=".9s"/></circle>
    <circle cx="1180" cy="130" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <line x1="0" y1="0" x2="46" y2="14" stroke="#ffe8cf" stroke-width="1.6" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.62;.66;.72;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="220,20; 420,84" dur="9s" repeatCount="indefinite" calcMode="linear"/>
  </g>

  <!-- moon -->
  <circle cx="1044" cy="84" r="86" fill="url(#moonGlow)">
    <animate attributeName="opacity" values=".8;1;.8" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1044" cy="84" r="34" fill="#ffe8cf"/>
  <circle cx="1032" cy="76" r="6" fill="#f4d3ae" opacity=".8"/>
  <circle cx="1054" cy="94" r="4" fill="#f4d3ae" opacity=".7"/>
  <circle cx="1050" cy="70" r="2.6" fill="#f4d3ae" opacity=".6"/>

  <!-- constellation line (a quiet quant nod) -->
  <g opacity=".5">
    <path id="mkt" d="M 300 118 L 380 96 L 450 108 L 530 78 L 610 92 L 690 64 L 770 76" fill="none" stroke="#ffb56b" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 5"/>
    <g fill="#ffb56b" fill-opacity=".5">
      <circle cx="380" cy="96" r="1.6"/><circle cx="530" cy="78" r="1.6"/><circle cx="690" cy="64" r="1.6"/>
    </g>
    <circle r="2.6" fill="#ff7a3c">
      <animateMotion dur="10s" repeatCount="indefinite" rotate="none">
        <mpath href="#mkt"/>
      </animateMotion>
      <animate attributeName="opacity" values=".9;.4;.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffe8cf" opacity=".05">
    <rect x="140" y="52" width="200" height="14" rx="7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 26,0; 0,0" dur="30s" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="120" width="260" height="16" rx="8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -30,0; 0,0" dur="38s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- skyline · back -->
  <g fill="#241b33">
    <rect x="270" y="196" width="58" height="104"/>
    <rect x="336" y="176" width="44" height="124"/>
    <rect x="388" y="206" width="66" height="94"/>
    <rect x="462" y="186" width="40" height="114"/>
    <rect x="508" y="212" width="72" height="88"/>
    <rect x="588" y="182" width="48" height="118"/>
    <rect x="644" y="202" width="64" height="98"/>
    <rect x="716" y="172" width="42" height="128"/>
    <rect x="764" y="208" width="70" height="92"/>
    <rect x="842" y="188" width="48" height="112"/>
    <rect x="896" y="214" width="76" height="86"/>
    <rect x="980" y="196" width="52" height="104"/>
    <rect x="1038" y="220" width="80" height="80"/>
    <rect x="1124" y="200" width="60" height="100"/>
    <rect x="352" y="164" width="12" height="14"/>
    <rect x="726" y="160" width="10" height="14"/>
  </g>

  <!-- windows -->
  <g fill="#ffd9a0" opacity=".85">
    <rect x="348" y="192" width="5" height="7"/>
    <rect x="362" y="214" width="5" height="7"/>
    <rect x="475" y="200" width="5" height="7">
      <animate attributeName="opacity" values="1;.15;1" dur="6s" repeatCount="indefinite" begin="2s"/>
    </rect>
    <rect x="601" y="198" width="5" height="7"/>
    <rect x="616" y="226" width="5" height="7">
      <animate attributeName="opacity" values=".2;1;.2" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="729" y="188" width="5" height="7"/>
    <rect x="744" y="212" width="5" height="7"/>
    <rect x="856" y="204" width="5" height="7">
      <animate attributeName="opacity" values="1;.2;1" dur="8s" repeatCount="indefinite" begin="3.4s"/>
    </rect>
    <rect x="994" y="212" width="5" height="7"/>
    <rect x="1140" y="216" width="5" height="7"/>
  </g>

  <!-- skyline · front -->
  <g fill="#17101f">
    <rect x="250" y="248" width="120" height="52"/>
    <rect x="420" y="256" width="150" height="44"/>
    <rect x="620" y="250" width="130" height="50"/>
    <rect x="800" y="258" width="170" height="42"/>
    <rect x="1010" y="252" width="190" height="48"/>
  </g>

  <!-- ramen shop -->
  <g>
    <rect x="46" y="170" width="196" height="130" fill="#1d1426"/>
    <rect x="46" y="170" width="196" height="8" fill="#140d1c"/>
    <g>
      <rect x="38" y="196" width="212" height="26" rx="4" fill="#ff7a3c"/>
      <rect x="38"  y="196" width="26.5" height="26" rx="4" fill="#ffe8cf"/>
      <rect x="91"  y="196" width="26.5" height="26" fill="#ffe8cf"/>
      <rect x="144" y="196" width="26.5" height="26" fill="#ffe8cf"/>
      <rect x="197" y="196" width="26.5" height="26" fill="#ffe8cf"/>
    </g>
    <rect x="74" y="146" width="140" height="40" rx="8" fill="#0f0a16" stroke="#ff7a3c" stroke-width="1.5"/>
    <text x="144" y="174" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" font-weight="700" fill="#ffb56b">ラーメン<animate attributeName="opacity" values="1;.55;1" dur="3.4s" repeatCount="indefinite"/></text>
    <circle cx="144" cy="166" r="44" fill="url(#lampGlow)" opacity=".6">
      <animate attributeName="opacity" values=".6;.3;.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="66" y="236" width="70" height="44" rx="4" fill="#2b1712"/>
    <rect x="70" y="240" width="62" height="36" rx="3" fill="#3a2015"/>
    <path d="M 84 268 A 17 12 0 0 0 118 268 Z" fill="#ffe8cf"/>
    <rect x="82" y="266" width="38" height="3" rx="1.5" fill="#ff7a3c"/>
    <g stroke="#ffe8cf" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55">
      <path d="M 92 258 q 3 -5 0 -10">
        <animate attributeName="opacity" values="0;.6;0" dur="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 101 256 q -3 -5 0 -10">
        <animate attributeName="opacity" values="0;.6;0" dur="2.6s" repeatCount="indefinite" begin=".9s"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6" dur="2.6s" repeatCount="indefinite" begin=".9s"/>
      </path>
      <path d="M 110 258 q 3 -5 0 -10">
        <animate attributeName="opacity" values="0;.6;0" dur="2.6s" repeatCount="indefinite" begin="1.7s"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5" dur="2.6s" repeatCount="indefinite" begin="1.7s"/>
      </path>
    </g>
    <rect x="158" y="234" width="52" height="66" rx="4" fill="#140d1c"/>
    <rect x="162" y="238" width="44" height="34" rx="3" fill="#2b1712"/>
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 24 200; 5 24 200; -5 24 200" dur="4.4s" repeatCount="indefinite"/>
        <line x1="24" y1="200" x2="24" y2="212" stroke="#3a2015" stroke-width="2"/>
        <ellipse cx="24" cy="226" rx="11" ry="14" fill="#ff5a4e"/>
        <line x1="16" y1="219" x2="16" y2="233" stroke="#c23e35" stroke-width="1"/>
        <line x1="24" y1="216" x2="24" y2="236" stroke="#c23e35" stroke-width="1"/>
        <line x1="32" y1="219" x2="32" y2="233" stroke="#c23e35" stroke-width="1"/>
        <circle cx="24" cy="226" r="20" fill="url(#lampGlow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="4 258 200; -4 258 200; 4 258 200" dur="5.1s" repeatCount="indefinite"/>
        <line x1="258" y1="200" x2="258" y2="212" stroke="#3a2015" stroke-width="2"/>
        <ellipse cx="258" cy="226" rx="11" ry="14" fill="#ff5a4e"/>
        <line x1="250" y1="219" x2="250" y2="233" stroke="#c23e35" stroke-width="1"/>
        <line x1="258" y1="216" x2="258" y2="236" stroke="#c23e35" stroke-width="1"/>
        <line x1="266" y1="219" x2="266" y2="233" stroke="#c23e35" stroke-width="1"/>
        <circle cx="258" cy="226" r="20" fill="url(#lampGlow)"/>
      </g>
    </g>
  </g>

  <rect y="298" width="1200" height="2" fill="#0b0918"/>

  <!-- name block -->
  <g>
    <text x="640" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#ffb56b" letter-spacing="2" opacity=".9">☾ welcome to my corner of the internet</text>
    <text x="640" y="205" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="10" fill="url(#nameShine)" filter="url(#soft6)" opacity=".55">DAKSH SHINDE</text>
    <text x="640" y="205" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="10" fill="url(#nameShine)">DAKSH SHINDE<animate attributeName="opacity" values="1;.88;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="640" y="236" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#e8d5c0" opacity=".85">ai engineering · quant finance · cs @ sggs nanded</text>
    <rect x="601" y="252" width="78" height="2.5" rx="1.25" fill="#ff7a3c">
      <animate attributeName="width" values="30;78;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="625;601;625" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
