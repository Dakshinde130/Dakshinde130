name: Random Dev Quote

# Rotates the liquid-glass quote card a few times a day by re-generating
# quote-card.svg with a new random quote and committing it.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC) — change to taste
  push:
    branches: [main]          # also rotate whenever you push to main
  workflow_dispatch:          # run on demand from the Actions tab

permissions:
  contents: write

jobs:
  rotate-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate a fresh quote card
        run: python3 generate_quote.py

      - name: Commit if the quote changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote-card.svg
          if git diff --staged --quiet; then
            echo "Quote unchanged — nothing to commit."
          else
            git commit -m "🔄 rotate random dev quote"
            git push
          fi
