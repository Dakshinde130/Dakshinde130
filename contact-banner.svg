<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Let's build something real — email me anytime">
  <defs>
    <linearGradient id="ccard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171021"/>
      <stop offset=".8" stop-color="#1d1216"/>
      <stop offset="1" stop-color="#241318"/>
    </linearGradient>
    <radialGradient id="cglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cshimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe8cf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe8cf" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffe8cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="csoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="896" height="236" rx="22" fill="url(#ccard)" stroke="#2a2140" stroke-width="1.5"/>

  <!-- stars -->
  <g fill="#ffe8cf">
    <circle cx="180" cy="44" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.9s" repeatCount="indefinite" begin=".7s"/></circle>
    <circle cx="620" cy="36" r="1.2"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="724" cy="52" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="26" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite" begin=".4s"/></circle>
  </g>

  <!-- hanging lanterns, left & right -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 84 2; 5 84 2; -5 84 2" dur="4.6s" repeatCount="indefinite"/>
      <line x1="84" y1="2" x2="84" y2="30" stroke="#3a2015" stroke-width="2"/>
      <ellipse cx="84" cy="46" rx="12" ry="15" fill="#ff5a4e"/>
      <line x1="75" y1="38" x2="75" y2="54" stroke="#c23e35" stroke-width="1"/>
      <line x1="84" y1="35" x2="84" y2="57" stroke="#c23e35" stroke-width="1"/>
      <line x1="93" y1="38" x2="93" y2="54" stroke="#c23e35" stroke-width="1"/>
      <circle cx="84" cy="46" r="24" fill="url(#cglow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 816 2; -4 816 2; 4 816 2" dur="5.2s" repeatCount="indefinite"/>
      <line x1="816" y1="2" x2="816" y2="30" stroke="#3a2015" stroke-width="2"/>
      <ellipse cx="816" cy="46" rx="12" ry="15" fill="#ff5a4e"/>
      <line x1="807" y1="38" x2="807" y2="54" stroke="#c23e35" stroke-width="1"/>
      <line x1="816" y1="35" x2="816" y2="57" stroke="#c23e35" stroke-width="1"/>
      <line x1="825" y1="38" x2="825" y2="54" stroke="#c23e35" stroke-width="1"/>
      <circle cx="816" cy="46" r="24" fill="url(#cglow)"/>
    </g>
  </g>

  <!-- headline -->
  <text x="450" y="102" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="38" fill="#ffe8cf" filter="url(#csoft)" opacity=".5">let's build something real.</text>
  <text x="450" y="102" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="38" fill="#ffe8cf">let's build something real.<animate attributeName="opacity" values="1;.88;1" dur="5s" repeatCount="indefinite"/></text>

  <!-- subline -->
  <text x="450" y="136" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#b9a896">always up for a conversation — AI, quant trading, opportunities, or a random 2 a.m. idea</text>

  <!-- email pill -->
  <g>
    <rect x="330" y="160" width="240" height="44" rx="22" fill="#2b1712" stroke="#ff7a3c" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="160" width="240" height="44" rx="22" fill="url(#cglow)" opacity=".25">
      <animate attributeName="opacity" values=".25;.5;.25" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#ffb56b">✉ &#160;email me anytime</text>
  </g>

  <!-- sparkles -->
  <g font-family="Arial,sans-serif" fill="#ffb56b">
    <text x="238" y="182" font-size="13">✦<animate attributeName="opacity" values=".15;1;.15" dur="2.6s" repeatCount="indefinite"/></text>
    <text x="652" y="176" font-size="12">✦<animate attributeName="opacity" values="1;.15;1" dur="3.2s" repeatCount="indefinite" begin=".9s"/></text>
  </g>

  <!-- shimmer -->
  <rect x="-260" y="2" width="260" height="236" fill="url(#cshimmer)" transform="skewX(-12)">
    <animate attributeName="x" values="-260;1160" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
